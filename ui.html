<!doctype html>
<head>
<meta charset="utf-8">
<title>Spreadsheet</title>
</head>
<body>
<div class="spreadsheet" role="region" aria-roledescription="spreadsheet">
</div>

<div class="status" role="status"></div>

<script src="math.min.js"></script>
<script src="grid.js"></script>
<script src="spreadsheet.js"></script>

<script>
const s = new Spreadsheet();

console.log(`a2 = "a1/2": `, s.setCellContents("a2", "=a1/2"));
console.log(`a1 = 26: `, s.setCellContents("a1", 26));

function statusMessage (text, remove = false) {
const status = document.querySelector(".status");
status.textContent = text;
if (remove) setTimeout(() => status.textContent = "", 7000);
} // statusMessage
</script>

</body>
</html>
